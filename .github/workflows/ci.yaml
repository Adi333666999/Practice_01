name: Build and Push Docker image

on: 
    push:
      branches:
        - main
    pull_request:
      branches:
        - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repo code
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Log in to Docker Hub
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with: 
          username: ${{ secrets.DOCKERHUB_USERNAME  }}
          password: ${{ secrets.DOCKERHUB_TOKEN  }}

      - name: 4. Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{  github.event_name != 'pull_request'  }}
          tags: |
            ${{  secrets.DOCKERHUB_USERNAME  }}/flask-healthcheck:${{  github.sha  }}
            ${{  secrets.DOCKERHUB_USERNAME  }}/flask-healthcheck:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max